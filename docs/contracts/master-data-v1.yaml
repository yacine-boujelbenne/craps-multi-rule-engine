openapi: 3.0.3
info:
  title: SeaExport master data and shipment product links
  version: 1.2.0
  description: Additive Phase 2 contract. Existing /api/projects v2 JSON and applied
    V1-V3 migrations remain unchanged. Master-data changes preserve project/document
    versions. Project relationship mutations require the current expectedProjectVersion
    and increment project.version exactly once for effective changes; no-ops do not
    increment.
servers:
- url: http://localhost:8080
security:
- sessionAuth: []
paths:
  /api/countries:
    get:
      operationId: listIsoCountries
      summary: List active ISO 3166-1 alpha-2 countries
      description: Return active countries ordered by lower(name), then code, ascending.
      responses:
        '200':
          description: Complete application country reference list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
  /api/countries/{countryCode}/cities:
    get:
      operationId: searchCities
      summary: Search active cities within a country
      description: Return active cities for an active country, ordered by lower(name),
        then id, ascending. An unknown or inactive country returns 404; an active
        country with no matching cities returns an empty page.
      parameters:
      - in: path
        name: countryCode
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - in: query
        name: q
        required: false
        description: Optional case-insensitive literal name prefix. Trim surrounding
          whitespace and reject empty or whitespace-only input. Percent and underscore
          are literal characters, not search wildcards. Omission applies no name filter.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Country-scoped, name-ordered city page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/organizations/{organizationId}/addresses:
    get:
      operationId: listCompanyAddresses
      description: Ready accounts with directory read permission may list all addresses,
        including inactive ones, ordered by address_kind, created_at, then id ascending.
        Unknown organization returns 404. No query parameters.
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Structured addresses; legacy address_text is retained separately.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      operationId: createCompanyAddress
      description: ADMIN or OPERATOR may create an address. Lock the organization
        and, when supplied, check expectedOrganizationVersion against its current
        metadata version; mismatch returns 409. Address creation starts address.version
        at zero and does not change organization.version, project versions or document
        snapshots. Require exactly one of cityId or nonblank manualCity. The selected
        country and city must be active, and the city's country must match countryCode;
        invalid selections return 400 on the relevant field. Trim text, normalize
        blank optional text to null, and preserve postalCode as text including leading
        zeros. Existing inactive organizations remain editable under the same master-data
        permission rules.
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressWrite'
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/projects/{projectId}/products:
    get:
      operationId: listProjectProducts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Shipment-specific product selections and quantities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectProduct'
    post:
      operationId: addProjectProduct
      description: ADMIN or an operator assigned PACKING_LIST may enter shipment measurements
        and select an active configured grade belonging to the product. Only ADMIN
        may supply unitPrice or currency, including null. Reject operator-supplied
        price fields with 403. On grade selection, lock and copy its current version,
        code, name, carton net-weight default and price/currency into the shipment
        row. Missing defaults stay null. Explicit ADMIN price fields replace the copied
        price pair. Never calculate or overwrite measured weights from defaults.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProductWrite'
      responses:
        '201':
          description: Shipment product created; response includes shared projectVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProduct'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR with PACKING_LIST permission
  /api/projects/{projectId}/products/{projectProductId}:
    patch:
      operationId: updateProjectProduct
      description: Only ADMIN may supply unitPrice or currency, including unchanged
        values or null; reject operator attempts with 403. Omitted fields retain stored
        values. Retain applied defaults when the grade ID is unchanged; selecting
        a different active configured grade copies its current defaults as on creation.
        Clearing the grade clears applied grade metadata and price defaults unless
        ADMIN explicitly supplies a replacement price pair. Never refresh existing
        shipment values merely because a directory grade changes. Price and currency
        must be supplied together and either both null or both populated. Applied
        metadata is read-only; reject client writes.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: projectProductId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProductPatch'
      responses:
        '200':
          description: Shipment product updated; response includes shared projectVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProduct'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR with PACKING_LIST permission
  /api/organizations:
    get:
      operationId: listCompanies
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 250
      - in: query
        name: role
        schema:
          $ref: '#/components/schemas/CompanyRole'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Search and role-filter companies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
    post:
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyWrite'
      responses:
        '201':
          description: Company created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/organizations/{organizationId}:
    parameters:
    - in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getCompany
      responses:
        '200':
          description: Company with structured addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
    patch:
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
      responses:
        '200':
          description: Company updated with optimistic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/products:
    get:
      operationId: listProducts
      description: Preserve existing code/name literal-prefix search, name/id ordering,
        pagination and ADMIN-only includeInactive behavior. categoryId filters taxonomy
        assignments (not packing grades); unknown IDs yield an empty page. Return
        both legacy name and commercialName with identical values, metadata, all assigned
        taxonomy categories including inactive ones, and active packing grades. Reject
        unknown/repeated query parameters.
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 250
      - in: query
        name: categoryId
        schema:
          type: string
          format: uuid
      - in: query
        name: includeInactive
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Search products and category filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
    post:
      operationId: createProduct
      description: ADMIN or OPERATOR may create ordinary product metadata. Accept
        legacy name or commercialName; require at least one and reject differing trimmed
        values when both occur. Persist one canonical product.name and return both
        aliases. Default omitted defaultMeasurementUnit to KG; explicit null/blank
        is invalid. Preserve legacy active input, code validation and uniqueness.
        Trim text and normalize nullable blank metadata to null. No grade/default/price
        fields are accepted here; their endpoints remain ADMIN-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/products/{productId}:
    parameters:
    - in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getProduct
      description: Ready directory readers may read active or inactive products. Include
        both identical name aliases, metadata, all assigned taxonomy categories including
        inactive ones, and active packing grades. No query parameters.
      responses:
        '200':
          description: Product details, taxonomy categories and packing grades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
    patch:
      operationId: updateProduct
      description: ADMIN or OPERATOR may edit product metadata with expectedVersion.
        Merge supplied fields only; either name alias updates the same canonical field,
        and conflicting aliases return 400. Null clears nullable metadata; name/code/defaultMeasurementUnit/active
        are non-null. Lock product; stale versions return 409. Effective changes increment
        product.version once and audit transactionally; no-ops do neither. Existing
        project lines, applied defaults, prices and document snapshots remain unchanged.
        Reject unknown/query fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/product-taxonomy-categories:
    get:
      operationId: listProductTaxonomyCategories
      description: Ready directory readers may search active taxonomy categories by
        a trimmed case-insensitive literal code/name prefix, with q limited to 200
        characters. Order by lower(name), then id ascending. includeInactive=true
        requires ADMIN; default false. Reject unknown/repeated query parameters.
      parameters:
      - in: query
        name: includeInactive
        schema:
          type: boolean
          default: false
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Configurable product taxonomy categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTaxonomyCategoryPage'
    post:
      operationId: createProductTaxonomyCategory
      description: ADMIN or OPERATOR may create an active category at version zero.
        Trim required nonblank code/name and normalize blank optional description
        to null. Code uniqueness is case-sensitive as stored; duplicate returns 409.
        Audit insert without changing product/project versions or historical documents.
        No query parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTaxonomyCategoryWrite'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTaxonomyCategory'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/product-taxonomy-categories/{categoryId}:
    parameters:
    - in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateProductTaxonomyCategory
      description: ADMIN or OPERATOR may edit/deactivate a category. Lock and check
        expectedVersion (409 when stale), merge supplied fields and preserve omitted
        fields. Null clears description only. Effective changes increment category.version
        once and audit; no-ops do neither. Preserve existing assignments and project/document
        history. Unknown category returns 404; duplicate code returns 409. No query
        parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTaxonomyCategoryPatch'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTaxonomyCategory'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/products/{productId}/taxonomy-categories:
    parameters:
    - in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listProductCategoryAssignments
      description: Ready directory readers may list all assigned categories, including
        inactive ones, ordered by lower(name),id ascending. Missing product returns
        404; no assignments returns an empty array. No query parameters.
      responses:
        '200':
          description: Product taxonomy assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTaxonomyCategory'
    put:
      operationId: replaceProductCategoryAssignments
      description: ADMIN or OPERATOR may atomically replace the taxonomy set. Lock
        product, check expectedProductVersion, and lock category rows in sorted UUID
        order. Reject duplicate/null/malformed IDs with 400; newly added categories
        must exist and be active (400). Existing inactive assignments may be retained
        or removed. Empty set clears all. A changed set increments product.version
        once and audits assignment changes plus the product revision; reordered or
        identical sets are no-ops. Return the ordered category array; read product
        GET for the new product version. No project/document/grade/default changes
        or query parameters. Missing product returns 404; stale version returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expectedProductVersion
              - categoryIds
              properties:
                expectedProductVersion:
                  type: integer
                  minimum: 0
                  format: int64
                categoryIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Assignments replaced atomically.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTaxonomyCategory'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/organizations/{organizationId}/addresses/{addressId}:
    parameters:
    - in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: addressId
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateCompanyAddress
      description: ADMIN or OPERATOR may update or deactivate an address. Lock organization
        then address; require expectedVersion for that address, returning 409 when
        stale. An address outside the organization returns 404. Merge only supplied
        fields; null clears nullable fields. Validate exactly one city selection after
        merging; switching between cityId and manualCity requires explicitly clearing
        the old selection. Validate active country/city only when the effective location
        selection changes; retain unchanged historical inactive references during
        other edits. New or changed invalid selections return 400. Effective changes
        increment only address.version once and audit the address in the same transaction;
        no-ops change neither version nor audit. Organization/project versions, legacy
        addressText and existing document snapshots remain unchanged. Unknown or read-only
        fields and query parameters return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Invalid request or unauthenticated
          content:
            application/problem+json:
              schema:
                type: object
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
        '409':
          description: Revision conflict
          content:
            application/problem+json:
              schema:
                type: object
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/ports:
    get:
      operationId: listPorts
      responses:
        '200':
          description: Active ports stored in the database
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    countryCode:
                      type: string
                    unLocode:
                      type: string
                      nullable: true
                    active:
                      type: boolean
    post:
      operationId: createPort
      description: ADMIN or OPERATOR creates a real port record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - countryCode
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                countryCode:
                  type: string
                  pattern: ^[A-Z]{2}$
      responses:
        '201':
          description: Port saved
  /api/projects/{projectId}/forms:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getShipmentForms
      responses:
        '200':
          description: Saved shipment form data and field definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentForms'
  /api/projects/{projectId}/forms/{key}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - in: path
      name: key
      required: true
      schema:
        type: string
    put:
      operationId: saveShipmentForm
      description: Requires the corresponding form assignment or ADMIN. Replaces only
        this form; project revision and audit update atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expectedProjectVersion
              - data
              properties:
                expectedProjectVersion:
                  type: integer
                  minimum: 0
                data:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties:
                      type: string
                      maxLength: 2000
      responses:
        '200':
          description: Saved shipment form data and field definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentForms'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Invalid request or unauthenticated
      content:
        application/problem+json:
          schema:
            type: object
    Forbidden:
      description: Forbidden
      content:
