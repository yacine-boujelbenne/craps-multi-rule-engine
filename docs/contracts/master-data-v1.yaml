openapi: 3.0.3
info:
  title: SeaExport master data and shipment product links
  version: 1.1.0
  description: Additive Phase 2 contract. Existing /api/projects v2 JSON and applied V1-V3 migrations remain unchanged.
    Master-data changes preserve project/document versions. Project relationship mutations require the current expectedProjectVersion
    and increment project.version exactly once for effective changes; no-ops do not increment.
servers:
- url: http://localhost:8080
security:
- sessionAuth: []
paths:
  /api/countries:
    get:
      operationId: listIsoCountries
      summary: List active ISO 3166-1 alpha-2 countries
      responses:
        '200':
          description: Complete application country reference list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
  /api/countries/{countryCode}/cities:
    get:
      operationId: searchCities
      summary: Search active cities within a country
      parameters:
      - in: path
        name: countryCode
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - in: query
        name: q
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Country-scoped, name-ordered city page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPage'
  /api/organizations/{organizationId}/addresses:
    get:
      operationId: listCompanyAddresses
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Structured addresses; legacy address_text is retained separately.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      operationId: createCompanyAddress
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressWrite'
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/factories:
    get:
      operationId: searchFactories
      parameters:
      - in: query
        name: companyId
        schema:
          type: string
          format: uuid
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 250
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Searchable active factory page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryPage'
    post:
      operationId: createFactory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryWrite'
      responses:
        '201':
          description: Factory created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/factories/{factoryId}:
    get:
      operationId: getFactory
      parameters:
      - $ref: '#/components/parameters/FactoryId'
      responses:
        '200':
          description: Factory metadata and current eligible approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateFactory
      parameters:
      - $ref: '#/components/parameters/FactoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryPatch'
      responses:
        '200':
          description: Updated factory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/factories/{factoryId}/approvals:
    get:
      operationId: listFactoryApprovals
      parameters:
      - $ref: '#/components/parameters/FactoryId'
      responses:
        '200':
          description: Append-only approval reference history, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FactoryApproval'
    post:
      operationId: recordFactoryApproval
      parameters:
      - $ref: '#/components/parameters/FactoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryApprovalWrite'
      responses:
        '201':
          description: Immutable approval revision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryApproval'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/projects/{projectId}/factory:
    parameters:
    - &id006
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getProjectFactory
      responses:
        '200':
          description: Selected factory and approval snapshot source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFactory'
        '404': &id001
          description: Company, factory, city, product or project does not exist or is inaccessible.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
    put:
      operationId: selectProjectFactory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFactoryWrite'
      responses:
        '200':
          description: Factory selected; shared project revision increments once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFactory'
        '400': &id003
          description: Invalid field, shape, date, role, city/country or quantity.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
        '403': &id004
          description: Account role, form grant or CSRF check failed.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
        '404': *id001
        '409': &id002
          description: Stale project/entity version, duplicate approval namespace/reference, or approval revision
            conflict.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
      x-authorized-roles:
      - ADMIN
      - OPERATOR with PROJECT_SETUP
  /api/projects/{projectId}/products:
    get:
      operationId: listProjectProducts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Shipment-specific product selections and quantities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectProduct'
    post:
      operationId: addProjectProduct
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProductWrite'
      responses:
        '201':
          description: Shipment product created; response includes shared projectVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProduct'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR with PACKING_LIST permission
  /api/projects/{projectId}/products/{projectProductId}:
    patch:
      operationId: updateProjectProduct
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - in: path
        name: projectProductId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProductPatch'
      responses:
        '200':
          description: Shipment product updated; response includes shared projectVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProduct'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR with PACKING_LIST permission
  /api/organizations:
    get:
      operationId: listCompanies
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 250
      - in: query
        name: role
        schema:
          $ref: '#/components/schemas/CompanyRole'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Search and role-filter companies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401': *id003
        '403': *id004
      x-authorized-roles:
      - ADMIN
      - OPERATOR
    post:
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyWrite'
      responses:
        '201':
          description: Company created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400': *id003
        '401': *id003
        '403': *id004
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/organizations/{organizationId}:
    parameters:
    - &id005
      in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getCompany
      responses:
        '200':
          description: Company with structured addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404': *id001
    patch:
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
      responses:
        '200':
          description: Company updated with optimistic version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400': *id003
        '403': *id004
        '404': *id001
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/products:
    get:
      operationId: listProducts
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 250
      - in: query
        name: categoryId
        schema:
          type: string
          format: uuid
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Search products and category filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401': *id003
        '403': *id004
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': *id003
        '403': *id004
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/products/{productId}:
    parameters:
    - in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getProduct
      responses:
        '200':
          description: Product details, taxonomy categories and packing grades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404': *id001
    patch:
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': *id003
        '403': *id004
        '404': *id001
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/product-taxonomy-categories:
    get:
      operationId: listProductTaxonomyCategories
      parameters:
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Configurable product taxonomy categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTaxonomyCategoryPage'
    post:
      operationId: createProductTaxonomyCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTaxonomyCategoryWrite'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTaxonomyCategory'
        '400': *id003
        '403': *id004
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/product-taxonomy-categories/{categoryId}:
    parameters:
    - in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateProductTaxonomyCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTaxonomyCategoryPatch'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTaxonomyCategory'
        '400': *id003
        '403': *id004
        '404': *id001
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/products/{productId}/taxonomy-categories:
    parameters:
    - in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listProductCategoryAssignments
      responses:
        '200':
          description: Product taxonomy assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTaxonomyCategory'
    put:
      operationId: replaceProductCategoryAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expectedProductVersion
              - categoryIds
              properties:
                expectedProductVersion:
                  type: integer
                  minimum: 0
                  format: int64
                categoryIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Assignments replaced atomically.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTaxonomyCategory'
        '400': *id003
        '403': *id004
        '404': *id001
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
  /api/organizations/{organizationId}/addresses/{addressId}:
    parameters:
    - *id005
    - in: path
      name: addressId
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateCompanyAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400': *id003
        '403': *id004
        '404': *id001
        '409': *id002
      x-authorized-roles:
      - ADMIN
      - OPERATOR
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    OrganizationId: *id005
    FactoryId:
      in: path
      name: factoryId
      required: true
      schema:
        type: string
        format: uuid
    ProjectId: *id006
  responses:
    InvalidRequest: *id003
    Forbidden: *id004
    NotFound: *id001
    Conflict: *id002
  schemas:
    Country:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
        name:
          type: string
    City:
      type: object
      required:
      - id
      - countryCode
      - name
      - active
      properties:
        id:
          type: string
          format: uuid
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        name:
          type: string
          maxLength: 200
        active:
          type: boolean
    CityPage:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Address:
      type: object
      required:
      - id
      - organizationId
      - kind
      - countryCode
      - cityId
      - manualCity
      - addressLine1
      - addressLine2
      - postalCode
      - active
      - version
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - BUSINESS
          - FACTORY
          - BILLING
          - OTHER
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        cityId:
          type: string
          format: uuid
          nullable: true
        manualCity:
          type: string
          maxLength: 200
          nullable: true
        addressLine1:
          type: string
          maxLength: 250
        addressLine2:
          type: string
          maxLength: 250
          nullable: true
        postalCode:
          type: string
          maxLength: 40
          nullable: true
        active:
          type: boolean
        version:
          type: integer
          format: int64
    AddressWrite:
      type: object
      required:
      - kind
      - countryCode
      - addressLine1
      properties:
        kind: &id038
          type: string
          enum:
          - BUSINESS
          - FACTORY
          - BILLING
          - OTHER
        countryCode: &id039
          type: string
          pattern: ^[A-Z]{2}$
        cityId: &id040
          type: string
          format: uuid
          nullable: true
        manualCity: &id041
          type: string
          maxLength: 200
          nullable: true
        addressLine1: &id042
          type: string
          maxLength: 250
        addressLine2: &id043
          type: string
          maxLength: 250
          nullable: true
        postalCode: &id044
          type: string
          maxLength: 40
          nullable: true
        expectedOrganizationVersion:
          type: integer
          minimum: 0
          format: int64
    Company:
      type: object
      required:
      - id
      - version
      - legalName
      - tradeName
      - registrationNumber
      - taxIdentifier
      - email
      - phone
      - roles
      - addresses
      - active
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        legalName:
          type: string
          maxLength: 250
        tradeName:
          type: string
          maxLength: 250
          nullable: true
        registrationNumber:
          type: string
          maxLength: 100
          nullable: true
        taxIdentifier:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - EXPORTER
            - CLIENT
            - BUYER
            - CONSIGNEE
            - PRODUCER
            - SUPPLIER
            - FREIGHT_FORWARDER
            - NOTIFY_PARTY
            - SHIPPING_LINE
            - CARRIER
            - AUTHORITY
            - IMPORTER
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        active:
          type: boolean
    Product:
      type: object
      required:
      - id
      - version
      - code
      - commercialName
      - scientificName
      - hsCode
      - description
      - processingMethod
      - storageRequirements
      - defaultMeasurementUnit
      - categories
      - active
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        code:
          type: string
          maxLength: 80
        commercialName:
          type: string
          maxLength: 250
        scientificName:
          type: string
          maxLength: 250
          nullable: true
        hsCode:
          type: string
          pattern: ^[0-9]{6,10}$
          nullable: true
        description:
          type: string
          nullable: true
        processingMethod:
          type: string
          maxLength: 150
          nullable: true
        storageRequirements:
          type: string
          maxLength: 500
          nullable: true
        defaultMeasurementUnit:
          type: string
          maxLength: 30
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ProductTaxonomyCategory'
        grades:
          type: array
          items:
            $ref: '#/components/schemas/ProductGrade'
        active:
          type: boolean
    ProductTaxonomyCategory:
      type: object
      required:
      - id
      - code
      - name
      - active
      - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 500
          nullable: true
        active:
          type: boolean
        version:
          type: integer
          format: int64
    ProductGrade:
      description: Existing per-product configurable product_category used by packing grades.
      allOf:
      - $ref: ./commercial-setup-v1.yaml#/components/schemas/GradeResponse
    Factory:
      type: object
      required:
      - id
      - companyId
      - name
      - addressId
      - establishmentDetails
      - active
      - version
      - currentApproval
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 250
        addressId:
          type: string
          format: uuid
          nullable: true
        establishmentDetails:
          type: string
          nullable: true
        active:
          type: boolean
        version:
          type: integer
          format: int64
        currentApproval:
          allOf:
          - $ref: '#/components/schemas/FactoryApproval'
          nullable: true
    FactoryPage:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
