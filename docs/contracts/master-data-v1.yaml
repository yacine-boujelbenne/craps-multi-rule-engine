openapi: 3.0.3
info:
  title: SeaExport master data and shipment product links
  version: 1.0.0
  description: |-
    Additive Phase 2 contract. Existing /api/projects JSON and applied V1-V3
    migrations are unchanged. Company is the existing organization entity.
servers:
  - url: http://localhost:8080
security:
  - sessionAuth: []
paths:
  /api/countries:
    get:
      operationId: listIsoCountries
      summary: List active ISO 3166-1 alpha-2 countries
      responses:
        '200':
          description: Complete application country reference list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Country' }
  /api/countries/{countryCode}/cities:
    get:
      operationId: searchCities
      summary: Search active cities within a country
      parameters:
        - in: path
          name: countryCode
          required: true
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - in: query
          name: q
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Country-scoped, name-ordered city page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CityPage' }
  /api/organizations/{organizationId}/addresses:
    get:
      operationId: listCompanyAddresses
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Structured addresses; legacy address_text is retained separately.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      operationId: createCompanyAddress
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressWrite' }
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/factories:
    get:
      operationId: searchFactories
      parameters:
        - in: query
          name: companyId
          schema: { type: string, format: uuid }
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 250 }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Searchable active factory page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryPage' }
    post:
      operationId: createFactory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactoryWrite' }
      responses:
        '201':
          description: Factory created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factory' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/factories/{factoryId}:
    get:
      operationId: getFactory
      parameters: [ { $ref: '#/components/parameters/FactoryId' } ]
      responses:
        '200':
          description: Factory metadata and current eligible approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factory' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateFactory
      parameters: [ { $ref: '#/components/parameters/FactoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactoryPatch' }
      responses:
        '200':
          description: Updated factory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factory' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/factories/{factoryId}/approvals:
    get:
      operationId: listFactoryApprovals
      parameters: [ { $ref: '#/components/parameters/FactoryId' } ]
      responses:
        '200':
          description: Append-only approval reference history, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FactoryApproval' }
    post:
      operationId: recordFactoryApproval
      parameters: [ { $ref: '#/components/parameters/FactoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactoryApprovalWrite' }
      responses:
        '201':
          description: Immutable approval revision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryApproval' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/projects/{projectId}/factory:
    put:
      operationId: selectProjectFactory
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, factoryId]
              properties:
                expectedVersion: { type: integer, minimum: 0, format: int64 }
                factoryId: { type: string, format: uuid }
      responses:
        '200':
          description: Factory selected for shipment. Project revision incremented once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectFactory' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/projects/{projectId}/products:
    get:
      operationId: listProjectProducts
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200':
          description: Shipment-specific product selections and quantities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectProduct' }
    post:
      operationId: addProjectProduct
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectProductWrite' }
      responses:
        '201':
          description: Shipment product selection created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectProduct' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/projects/{projectId}/products/{projectProductId}:
    patch:
      operationId: updateProjectProduct
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - in: path
          name: projectProductId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectProductPatch' }
      responses:
        '200':
          description: Shipment product selection updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectProduct' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema: { type: string, format: uuid }
    FactoryId:
      in: path
      name: factoryId
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
  responses:
    InvalidRequest:
      description: Invalid field, shape, date, role, city/country or quantity.
      content:
        application/problem+json:
          schema: { $ref: ./projects-v2.yaml#/components/schemas/Problem }
    Forbidden:
      description: Account role, form grant or CSRF check failed.
      content:
        application/problem+json:
          schema: { $ref: ./projects-v2.yaml#/components/schemas/Problem }
    NotFound:
      description: Company, factory, city, product or project does not exist or is inaccessible.
      content:
        application/problem+json:
          schema: { $ref: ./projects-v2.yaml#/components/schemas/Problem }
    Conflict:
      description: Stale project/entity version, duplicate approval namespace/reference, or approval revision conflict.
      content:
        application/problem+json:
          schema: { $ref: ./projects-v2.yaml#/components/schemas/Problem }
  schemas:
    Country:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2 }
        name: { type: string }
    City:
      type: object
      required: [id, countryCode, name, active]
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        name: { type: string, maxLength: 200 }
        active: { type: boolean }
    CityPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/City' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Address:
      type: object
      required: [id, organizationId, kind, countryCode, cityId, manualCity, addressLine1, addressLine2, postalCode, active, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        kind: { type: string, enum: [BUSINESS, FACTORY, BILLING, OTHER] }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        cityId: { type: string, format: uuid, nullable: true }
        manualCity: { type: string, maxLength: 200, nullable: true }
        addressLine1: { type: string, maxLength: 250 }
        addressLine2: { type: string, maxLength: 250, nullable: true }
        postalCode: { type: string, maxLength: 40, nullable: true }
        active: { type: boolean }
        version: { type: integer, format: int64 }
    AddressWrite:
      type: object
      required: [kind, countryCode, addressLine1]
      properties:
        kind: { type: string, enum: [BUSINESS, FACTORY, BILLING, OTHER] }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        cityId: { type: string, format: uuid, nullable: true }
        manualCity: { type: string, maxLength: 200, nullable: true }
        addressLine1: { type: string, maxLength: 250 }
        addressLine2: { type: string, maxLength: 250, nullable: true }
        postalCode: { type: string, maxLength: 40, nullable: true }
        expectedOrganizationVersion: { type: integer, minimum: 0, format: int64 }
    Company:
      type: object
      required: [id, version, legalName, tradeName, registrationNumber, taxIdentifier, email, phone, roles, active]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        legalName: { type: string, maxLength: 250 }
        tradeName: { type: string, maxLength: 250, nullable: true }
        registrationNumber: { type: string, maxLength: 100, nullable: true }
        taxIdentifier: { type: string, maxLength: 100, nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [EXPORTER, CLIENT, BUYER, CONSIGNEE, PRODUCER, SUPPLIER, FREIGHT_FORWARDER, NOTIFY_PARTY, SHIPPING_LINE, CARRIER, AUTHORITY, IMPORTER] }
        addresses: { type: array, items: { $ref: '#/components/schemas/Address' } }
        active: { type: boolean }
    Product:
      type: object
      required: [id, version, code, commercialName, scientificName, hsCode, description, processingMethod, storageRequirements, defaultMeasurementUnit, categories, active]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        code: { type: string, maxLength: 80 }
        commercialName: { type: string, maxLength: 250 }
        scientificName: { type: string, maxLength: 250, nullable: true }
        hsCode: { type: string, pattern: '^[0-9]{6,10}$', nullable: true }
        description: { type: string, nullable: true }
        processingMethod: { type: string, maxLength: 150, nullable: true }
        storageRequirements: { type: string, maxLength: 500, nullable: true }
        defaultMeasurementUnit: { type: string, maxLength: 30 }
        categories: { type: array, items: { $ref: '#/components/schemas/ProductTaxonomyCategory' } }
        grades: { type: array, items: { $ref: '#/components/schemas/ProductGrade' } }
        active: { type: boolean }
    ProductTaxonomyCategory:
      type: object
      required: [id, code, name, active, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 500, nullable: true }
        active: { type: boolean }
        version: { type: integer, format: int64 }
    ProductGrade:
      description: Existing per-product configurable product_category used by packing grades.
      allOf:
        - $ref: ./commercial-setup-v1.yaml#/components/schemas/GradeResponse
    Factory:
      type: object
      required: [id, companyId, name, addressId, establishmentDetails, active, version, currentApproval]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string, maxLength: 250 }
        addressId: { type: string, format: uuid, nullable: true }
        establishmentDetails: { type: string, nullable: true }
        active: { type: boolean }
        version: { type: integer, format: int64 }
        currentApproval: { allOf: [ { $ref: '#/components/schemas/FactoryApproval' } ], nullable: true }
    FactoryPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Factory' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    FactoryWrite:
      type: object
      required: [companyId, name]
      properties:
        companyId: { type: string, format: uuid }
        name: { type: string, maxLength: 250 }
        addressId: { type: string, format: uuid, nullable: true }
        establishmentDetails: { type: string, nullable: true }
    FactoryPatch:
      allOf:
        - $ref: '#/components/schemas/FactoryWrite'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 0, format: int64 }
    FactoryApproval:
      type: object
      required: [id, factoryId, issuingAuthority, numberingSystem, issuingCountryCode, approvalReference, validFrom, validUntil, recordedAt, recordedBy]
      properties:
        id: { type: string, format: uuid }
        factoryId: { type: string, format: uuid }
        issuingAuthority: { type: string, maxLength: 250 }
        numberingSystem: { type: string, maxLength: 120 }
        issuingCountryCode: { type: string, pattern: '^[A-Z]{2}$' }
        approvalReference: { type: string, maxLength: 150 }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string, format: uuid, nullable: true }
    FactoryApprovalWrite:
      type: object
      required: [issuingAuthority, numberingSystem, issuingCountryCode, approvalReference]
      properties:
        issuingAuthority: { type: string, maxLength: 250 }
        numberingSystem: { type: string, maxLength: 120 }
        issuingCountryCode: { type: string, pattern: '^[A-Z]{2}$' }
        approvalReference: { type: string, maxLength: 150 }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
    ProjectFactory:
      type: object
      required: [projectId, projectVersion, factoryId, producerCompanyId, approval]
      properties:
        projectId: { type: string, format: uuid }
        projectVersion: { type: integer, format: int64 }
        factoryId: { type: string, format: uuid }
        producerCompanyId: { type: string, format: uuid }
        approval: { allOf: [ { $ref: '#/components/schemas/FactoryApproval' } ], nullable: true }
    ProjectProduct:
      allOf:
        - $ref: '#/components/schemas/ProjectProductWrite'
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, format: int64 }
    ProjectProductWrite:
      type: object
      required: [productId]
      properties:
        productId: { type: string, format: uuid }
        productCategoryId: { type: string, format: uuid, nullable: true }
        cartonCount: { type: integer, minimum: 1, nullable: true }
        quantity: { type: string, pattern: '^[0-9]{1,15}(\\.[0-9]{1,3})?$', nullable: true }
        quantityUnit: { type: string, maxLength: 30, nullable: true }
        netWeightKg: { type: string, pattern: '^[0-9]{1,15}(\\.[0-9]{1,3})?$', nullable: true }
        grossWeightKg: { type: string, pattern: '^[0-9]{1,15}(\\.[0-9]{1,3})?$', nullable: true }
        unitPrice: { type: string, pattern: '^[0-9]{1,14}(\\.[0-9]{1,4})?$', nullable: true }
        currency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
        lotReference: { type: string, maxLength: 150, nullable: true }
        processingInformation: { type: string, nullable: true }
    ProjectProductPatch:
      allOf:
        - $ref: '#/components/schemas/ProjectProductWrite'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 0, format: int64 }
