                $ref: ./projects-v2.yaml#/components/schemas/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      x-required-role: ADMIN
    get:
      operationId: listOrganizations
      summary: List active organizations; fixed name ASC, id ASC order
