components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-managed session after local login. Mutating requests additionally
        require X-XSRF-TOKEN matching the XSRF-TOKEN cookie.
  schemas:
    OrganizationRole:
      type: string
      enum:
      - EXPORTER
      - PRODUCER
      - SUPPLIER
      - BUYER
      - CONSIGNEE
      - NOTIFY_PARTY
      - FREIGHT_FORWARDER
      - SHIPPING_LINE
      - AUTHORITY
      - CLIENT
      - IMPORTER
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
      - legalName
      - roles
      properties:
        legalName:
          type: string
          maxLength: 250
          minLength: 1
        countryCode:
          type: string
          nullable: true
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2. Validate actual code at service boundary.
        addressText:
          type: string
          maxLength: 4000
          nullable: true
        registrationNumber:
          type: string
          maxLength: 100
          nullable: true
        roles:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items: &id002
            $ref: '#/components/schemas/OrganizationRole'
        active:
          type: boolean
          default: true
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      properties:
        expectedVersion: &id003
          type: integer
          format: int64
          minimum: 0
        legalName:
          type: string
          maxLength: 250
          minLength: 1
        countryCode:
          type: string
          nullable: true
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2. Validate actual code at service boundary.
        addressText:
          type: string
          maxLength: 4000
          nullable: true
        registrationNumber:
          type: string
          maxLength: 100
          nullable: true
        roles:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items: *id002
        active:
          type: boolean
    OrganizationResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - legalName
      - countryCode
      - addressText
      - registrationNumber
      - roles
      - active
      - createdAt
      - updatedAt
      properties:
        id: *id001
        version: *id003
        legalName:
          type: string
          maxLength: 250
          minLength: 1
        countryCode:
          type: string
          nullable: true
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2. Validate actual code at service boundary.
        addressText:
          type: string
          maxLength: 4000
          nullable: true
        registrationNumber:
          type: string
          maxLength: 100
          nullable: true
        roles:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items: *id002
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code: &id004
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[A-Za-z0-9][A-Za-z0-9._/+-]{0,79}$
          description: Trim outer whitespace; preserve case. Uniqueness is case-sensitive,
            as in the database.
        name:
          type: string
          maxLength: 250
          minLength: 1
        scientificName:
          type: string
          maxLength: 250
          nullable: true
        hsCode:
          type: string
          nullable: true
          pattern: ^[0-9]{6,10}$
        active:
          type: boolean
          default: true
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      properties:
        expectedVersion: *id003
        code:
          type: string
          minLength: 1
          maxLength: 80
