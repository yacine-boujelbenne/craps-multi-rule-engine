openapi: 3.0.3
info:
  title: Commercial setup, directory and protected grade defaults
  version: 1.0.0
  description: Slice 1 target contract. Adds subresources without modifying Project
    v2 JSON. Local sessions/CSRF use accounts-access-v1. ADMIN exclusively changes
    directory/catalog defaults. Backend controllers/services are pending Agent 2 implementation.
servers:
- url: http://localhost:8080
security:
- sessionAuth: []
paths:
  /api/organizations:
    post:
      operationId: createOrganization
      summary: ADMIN creates organization
      responses:
        '201':
          description: Created. Location identifies the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          headers:
            Location:
              description: Canonical URI of the created resource.
              schema:
                type: string
        '400':
          description: Invalid fields/types/code/decimal precision, null nonnullable
            property, unknown field/query, or invalid pagination.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
        '401':
          description: Local authentication/session required.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
        '403':
          description: Insufficient role/form permission, temporary password restriction
            or CSRF failure.
          content:
            application/problem+json:
              schema:
                $ref: ./projects-v2.yaml#/components/schemas/Problem
        '409':
