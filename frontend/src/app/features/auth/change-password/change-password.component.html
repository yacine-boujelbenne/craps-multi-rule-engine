<div class="auth">
  <div class="auth__panel">
    <div class="auth__brand">
      <span class="auth__logo" aria-hidden="true">
        <app-icon name="ship" [size]="24" />
      </span>
      <span class="auth__brand-text">
        <strong>ExportDocs</strong>
        <small>Shipment workspace</small>
      </span>
    </div>

    <h1 class="auth__title">
      {{ forced() ? 'Set a new password' : 'Change password' }}
    </h1>
    @if (forced()) {
      <p class="auth__subtitle">
        Your account is using a temporary password. Choose a new password to continue.
      </p>
    } @else {
      <p class="auth__subtitle">Update the password for {{ user()?.displayName }}.</p>
    }

    @if (error(); as message) {
      <div class="alert alert--error" role="alert">
        <app-icon name="alert" [size]="18" />
        <span>{{ message }}</span>
      </div>
    }

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Current password</span>
        <input
          type="password"
          class="control"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        @if (form.controls.currentPassword.touched) {
          @if (form.controls.currentPassword.hasError('server')) {
            <span class="field__error">{{ form.controls.currentPassword.getError('server') }}</span>
          } @else if (form.controls.currentPassword.invalid) {
            <span class="field__error">Enter your current password.</span>
          }
        }
      </label>

      <label class="field">
        <span class="field__label">New password</span>
        <input
          type="password"
          class="control"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <span class="field__hint">
          At least {{ minLength }} characters. Must differ from your current password.
        </span>
        @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
          @if (form.controls.newPassword.hasError('server')) {
            <span class="field__error">{{ form.controls.newPassword.getError('server') }}</span>
          } @else if (form.controls.newPassword.hasError('passwordLength')) {
            <span class="field__error">Use between 12 and 64 characters.</span>
          } @else if (form.controls.newPassword.hasError('passwordBytes')) {
            <span class="field__error">Password is too long (max 72 bytes).</span>
          } @else {
            <span class="field__error">Choose a valid password.</span>
          }
        }
      </label>

      <label class="field">
        <span class="field__label">Confirm new password</span>
        <input
          type="password"
          class="control"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        @if (
          form.controls.confirmPassword.touched &&
          form.controls.confirmPassword.hasError('mismatch')
        ) {
          <span class="field__error">Passwords do not match.</span>
        }
      </label>

      <button type="submit" class="btn btn--primary auth__submit" [disabled]="loading()">
        {{ loading() ? 'Saving…' : 'Change password' }}
      </button>
      <button type="button" class="btn btn--ghost btn--block" (click)="signOut()">Sign out</button>
    </form>
  </div>
</div>
